[package]
name = "cinepos"
version = "1.0.0"
description = "CinePOS — Movie Booking & Theater Management System"
authors = ["CinePOS Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [
  "system-tray",
  "dialog-all",
  "fs-all",
  "path-all",
  "os-all",
  "window-all",
  "notification-all",
  "global-shortcut-all",
  "clipboard-all",
  "http-all",
  "process-all",
  "shell-open",
  "updater"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
